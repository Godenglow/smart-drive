server:
  port: 8083

spring:
  application:
    name: order-service
  task:
    scheduling:
      pool:
        size: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: ${MYSQL_ORDER_URL:jdbc:mysql://localhost:3306/order_db?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SMARTDRIVE_DB_USER:smartdrive}
    password: ${SMARTDRIVE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

smartdrive:
  internal-token: ${SMARTDRIVE_INTERNAL_TOKEN:}
  outbox:
    enabled: ${SMARTDRIVE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${SMARTDRIVE_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${SMARTDRIVE_OUTBOX_BATCH_SIZE:50}
    confirm-timeout-ms: ${SMARTDRIVE_OUTBOX_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    correlation: "[${spring.application.name:-},%X{requestId:-}]"

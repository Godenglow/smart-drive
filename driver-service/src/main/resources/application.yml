server:
  port: 8082

spring:
  application:
    name: driver-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        auto-startup: ${SMARTDRIVE_MATCHING_ENABLED:true}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: ${MYSQL_DRIVER_URL:jdbc:mysql://localhost:3306/driver_db?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SMARTDRIVE_DB_USER:smartdrive}
    password: ${SMARTDRIVE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    correlation: "[${spring.application.name:-},%X{requestId:-}]"

smartdrive:
  internal-token: ${SMARTDRIVE_INTERNAL_TOKEN:}
  matching:
    max-attempts: ${SMARTDRIVE_MATCHING_MAX_ATTEMPTS:4}
    initial-interval-ms: ${SMARTDRIVE_MATCHING_INITIAL_INTERVAL_MS:1000}
    max-interval-ms: ${SMARTDRIVE_MATCHING_MAX_INTERVAL_MS:5000}

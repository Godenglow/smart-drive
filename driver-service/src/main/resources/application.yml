server:
  port: 8082

spring:
  application:
    name: driver-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    correlation: "[${spring.application.name:-},%X{requestId:-}]"
